---
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  galaxy:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest
    if: secrets.GALAXY_API_KEY != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import role to Galaxy
        uses: ansible/galaxy-action@v1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
